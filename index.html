<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RailTrack España</title>
<style>
/* Plan visual: mapa a pantalla completa, paneles de cristal flotantes, acento azul sistema,
   un color por servicio ferroviario. Layout: móvil = hoja inferior; escritorio = panel izquierdo. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sea:#dce6ef; --land:#fafaf7; --land-pt:#eeede8; --coast:#b9c5d2;
  --glass:rgba(255,255,255,.76); --solid:#ffffff; --fill:#f0f2f6; --fill2:#e4e8ef;
  --text:#0f1318; --text2:#4b5461; --text3:#7a8391; --line:rgba(30,45,70,.12);
  --accent:#0a74f0; --accent-soft:rgba(10,116,240,.12); --on-accent:#fff;
  --good:#12803f; --good-soft:rgba(18,128,63,.12);
  --warn:#a85a00; --warn-soft:rgba(255,149,0,.18);
  --crit:#c82a29; --crit-soft:rgba(200,42,41,.12);
  --lvl1:#f2bf0a; --lvl2:#ff8a00; --lvl3:#ff3b30;
  --hs:#8795ab; --cv:#aeb8c6; --st:#fff; --st-line:#68727f; --lbl:#37404d; --halo:rgba(255,255,255,.9);
  --shadow:0 14px 36px rgba(17,28,48,.16),0 2px 8px rgba(17,28,48,.07);
  --tabh:64px; color-scheme:light;
}
:root.dark{
  --sea:#0a1017; --land:#18212b; --land-pt:#121920; --coast:#2c3846;
  --glass:rgba(27,32,41,.74); --solid:#1d232c; --fill:#262d38; --fill2:#323a47;
  --text:#f3f5f8; --text2:#b4bcc8; --text3:#838d9b; --line:rgba(255,255,255,.12);
  --accent:#3b9bff; --accent-soft:rgba(59,155,255,.2); --on-accent:#06121f;
  --good:#3ddc84; --good-soft:rgba(61,220,132,.16);
  --warn:#ffb340; --warn-soft:rgba(255,179,64,.18);
  --crit:#ff7a72; --crit-soft:rgba(255,122,114,.16);
  --hs:#586980; --cv:#394657; --st:#1d232c; --st-line:#9ba7b9; --lbl:#d9dfe8; --halo:rgba(10,16,23,.88);
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not(.light):not(.dark){
    --sea:#0a1017; --land:#18212b; --land-pt:#121920; --coast:#2c3846;
    --glass:rgba(27,32,41,.74); --solid:#1d232c; --fill:#262d38; --fill2:#323a47;
    --text:#f3f5f8; --text2:#b4bcc8; --text3:#838d9b; --line:rgba(255,255,255,.12);
    --accent:#3b9bff; --accent-soft:rgba(59,155,255,.2); --on-accent:#06121f;
    --good:#3ddc84; --good-soft:rgba(61,220,132,.16);
    --warn:#ffb340; --warn-soft:rgba(255,179,64,.18);
    --crit:#ff7a72; --crit-soft:rgba(255,122,114,.16);
    --hs:#586980; --cv:#394657; --st:#1d232c; --st-line:#9ba7b9; --lbl:#d9dfe8; --halo:rgba(10,16,23,.88);
    --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--sea);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(26px);backdrop-filter:saturate(1.8) blur(26px);box-shadow:var(--shadow);border:1px solid var(--line)}
svg{display:block}
[hidden]{display:none!important}
.ico{width:22px;height:22px;flex:none}

/* ---------- mapa ---------- */
#map{position:absolute;inset:0;width:100%;height:100%;background:var(--sea);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.land.pt{fill:var(--land-pt)}
.sealbl{fill:var(--text3);font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.55;font-weight:600}
.ln-hs{fill:none;stroke:var(--hs);stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linecap:round}
.ln-cv{fill:none;stroke:var(--cv);stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;stroke-linecap:round}
.no-cv .ln-cv{display:none}
.hl-case{fill:none;stroke:var(--solid);stroke-width:8;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.hl-line{fill:none;stroke-width:4.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.hl-done{fill:none;stroke:var(--text3);stroke-width:4.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.st .dot{fill:var(--st);stroke:var(--st-line);stroke-width:1.6}
.st.major .dot{stroke-width:2}
.st .lb{display:none;fill:var(--lbl);font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.st.major .lb{display:block}
#map[data-z="1"] .st .lb,#map[data-z="2"] .st .lb{display:block}
.no-lbl .st .lb{display:none!important}
.st .ring{display:none;fill:none;stroke:var(--accent);stroke-width:2.5}
.st.sel .ring{display:block}
.st.flt .dot{fill:var(--accent);stroke:var(--accent)}
.tr .body{stroke:#fff;stroke-width:2}
.tr .hd{pointer-events:none}
.tr .num{display:none;fill:var(--lbl);font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;pointer-events:none}
#map[data-z="2"] .tr .num{display:block}
.tr .dl{display:none;stroke:#fff;stroke-width:1.5}
.tr.late .dl{display:block;fill:var(--lvl2)}
.tr.vlate .dl{display:block;fill:var(--lvl3)}
.tr .sel,.tr .mine{display:none;fill:none;stroke:var(--accent);stroke-width:2.5}
.tr.sel .sel,.tr.mine .mine{display:block}
.tr.sel .sel{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.tr.stopped .body{opacity:.78}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.7);opacity:0}}
.user .me{fill:var(--accent);stroke:#fff;stroke-width:3}
.user .halo{fill:var(--accent);opacity:.22;animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.user .ulb{fill:var(--accent);font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px}
.rg{fill-opacity:.07;stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.rg.on{fill-opacity:.16;stroke-dasharray:none}
.pin .pc{fill:var(--accent);stroke:#fff;stroke-width:2.5}
.pin text{fill:#fff;font-size:10px;font-weight:800;text-anchor:middle}

/* ---------- barra superior ---------- */
.topbar{position:absolute;z-index:10;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);pointer-events:none;transition:top .3s cubic-bezier(.32,.72,0,1)}
.has-island .topbar{top:calc(env(safe-area-inset-top,0px) + 54px)}
.topbar>*{pointer-events:auto}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;border-radius:16px;padding:0 12px;color:var(--text2)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;outline:none;color:var(--text)}
.search input::placeholder{color:var(--text3)}
.search input::-webkit-search-cancel-button{display:none}
.roundbtn{position:relative;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);color:var(--text)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.results{margin-top:8px;border-radius:18px;max-height:46vh;overflow:auto;padding:6px}
.results h4{margin:8px 10px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.res{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:12px;text-align:left}
.res:hover,.res:focus-visible{background:var(--fill)}
.res small{display:block;color:var(--text2);font-size:12.5px}
.res .ri{width:30px;height:30px;border-radius:9px;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--text2)}
.empty{padding:16px;text-align:center;color:var(--text2);font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:8px -12px 0;padding:2px 12px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(17,28,48,.1);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.chip.off{opacity:.55;font-weight:500}
.chip.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.act{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip.clock{color:var(--text2);font-variant-numeric:tabular-nums}

.mapctl{position:absolute;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 124px);display:flex;flex-direction:column;border-radius:16px;overflow:hidden;transition:top .3s cubic-bezier(.32,.72,0,1)}
.has-island .mapctl{top:calc(env(safe-area-inset-top,0px) + 168px)}
.mapctl button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--text)}
.mapctl button+button{border-top:1px solid var(--line)}
.mapctl button.on{color:var(--accent)}
.banner{position:absolute;z-index:12;left:12px;right:68px;top:calc(env(safe-area-inset-top,0px) + 114px);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;color:#111;border:0;box-shadow:var(--shadow);animation:slide .35s cubic-bezier(.32,.72,0,1)}
.has-island .banner{top:calc(env(safe-area-inset-top,0px) + 158px)}
.banner.l1{background:var(--lvl1)}.banner.l2{background:var(--lvl2)}.banner.l3{background:var(--lvl3);color:#fff}
@keyframes slide{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- hoja inferior / panel ---------- */
.sheet{position:absolute;z-index:20;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--tabh) + 16px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;transition:height .38s cubic-bezier(.32,.72,0,1)}
.sheet[data-snap="peek"]{height:158px}
.sheet[data-snap="half"]{height:48%}
.sheet[data-snap="full"]{height:calc(100% - env(safe-area-inset-top,0px) - 172px - var(--tabh) - 16px)}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--text3);opacity:.5}
.shead{flex:none;padding:0 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.ht{flex:1;min-width:0}
.ht h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht p{margin:2px 0 0;font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ha{display:flex;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--text);flex:none}
.ib.on{color:var(--warn)}
.ib.on svg{fill:currentColor}
.ib .ico{width:19px;height:19px}
.sbody{flex:1;overflow:auto;padding:2px 16px 18px;-webkit-overflow-scrolling:touch}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sum>div{background:var(--fill);border-radius:14px;padding:8px 10px;min-width:0}
.sum small{display:block;font-size:11.5px;color:var(--text2)}
.sum b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12.5px;color:var(--text2);line-height:1.45;margin:10px 0}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 7px}
h3.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:18px 0 6px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .rm{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row small{display:block;color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.dotc{width:12px;height:12px;border-radius:50%;flex:none}
.sb{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--c);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-n{background:var(--fill2);color:var(--text2)}
.card{background:var(--fill);border-radius:18px;padding:14px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;border:0;background:var(--fill2);font-weight:650;font-size:15px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.dan{background:var(--crit-soft);color:var(--crit)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:12.5px;color:var(--text2);margin-bottom:5px;font-weight:600}
.field select,.field input,.field textarea{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--fill);padding:0 12px;font-size:16px;outline:none}
.field textarea{padding:10px 12px;min-height:110px;resize:vertical}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.two .swap{margin-bottom:10px}
.err{color:var(--crit);font-size:13.5px;margin:8px 0;font-weight:600}
.okmsg{color:var(--good);font-size:13.5px;margin:8px 0;font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--fill2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);width:0;transition:width .4s linear}
.pct{font-size:30px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--fill);border-radius:14px;padding:10px 12px}
.stat small{display:block;font-size:12px;color:var(--text2)}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:6px 0;padding:0;position:relative}
.tl li{position:relative;display:flex;gap:12px;padding:0 0 16px 24px;min-height:34px}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:-4px;width:2px;background:var(--fill2)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:var(--solid);border:2.5px solid var(--text3)}
.tl li.past{color:var(--text3)}
.tl li.past::after{background:var(--text3)}
.tl li.cur::after{border-color:var(--accent);background:var(--accent)}
.tl li.next::after{border-color:var(--accent)}
.tl li.next b{color:var(--accent)}
.tl .tn{flex:1;min-width:0}
.tl b{font-size:15px;display:block}
.tl small{color:var(--text2);font-size:12.5px}
.tl .tt{font-variant-numeric:tabular-nums;font-weight:650;text-align:right;font-size:14.5px}
.tl .tt small{display:block;font-weight:500}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:34px;font-size:14px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .sm{flex:1;min-width:0}
.set b{display:block;font-size:15px;font-weight:600}
.set small{display:block;color:var(--text2);font-size:12.5px;line-height:1.35}
.sw{width:51px;height:31px;border-radius:16px;border:0;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sw[aria-checked="true"]{background:#30b455}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.slider{display:flex;align-items:center;gap:10px;margin:8px 0}
.slider label{width:76px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.slider i{width:10px;height:10px;border-radius:50%}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.lvlbar{border-radius:14px;padding:10px 12px;font-weight:650;font-size:14.5px;background:var(--fill);display:flex;align-items:center;gap:10px;margin-top:10px}
.lvlbar.l1{background:var(--lvl1);color:#111}.lvlbar.l2{background:var(--lvl2);color:#111}.lvlbar.l3{background:var(--lvl3);color:#fff}
.arrow{width:30px;height:30px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;flex:none}
.arrow svg{width:18px;height:18px;transition:transform .4s}
.skel{height:56px;border-radius:14px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--text2);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--hs)}
.legend i.cv{border-top:2px dashed var(--cv)}

/* ---------- barra inferior ---------- */
.tabbar{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:var(--tabh);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.tab{border:0;background:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.tab.on{color:var(--accent);background:var(--accent-soft)}
.tab .ico{width:23px;height:23px}

/* ---------- Dynamic Island (simulación) ---------- */
.island{position:absolute;z-index:40;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);background:#000;color:#fff;border-radius:22px;min-width:150px;max-width:min(92vw,380px);padding:0 14px;height:36px;display:flex;align-items:center;overflow:hidden;cursor:pointer;border:0;text-align:left;transition:width .4s cubic-bezier(.32,.72,0,1),height .4s cubic-bezier(.32,.72,0,1),border-radius .4s;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.island[hidden]{display:none}
.island .ic{display:flex;align-items:center;gap:9px;width:100%;font-size:13px;font-weight:650;white-space:nowrap}

function legPos(leg,ul){const n=leg.ids.length;
  if(ul<=0)return{i:0,f:0,dwell:true,dist:0};
  if(ul>=leg.T)return{i:n-1,f:0,dwell:true,dist:leg.total};
  for(let i=0;i<n-1;i++){
    if(ul>=leg.arr[i]&&ul<leg.dep[i])return{i,f:0,dwell:true,dist:leg.cum[i]};
    if(ul>=leg.dep[i]&&ul<leg.arr[i+1]){const f=(ul-leg.dep[i])/(leg.arr[i+1]-leg.dep[i]);return{i,f,dwell:false,dist:leg.cum[i]+f*leg.seg[i]}}}
  return{i:n-1,f:0,dwell:true,dist:leg.total}}
function posOf(leg,p){const n=leg.ids.length,a=S[leg.ids[p.i]];let x,y,hx,hy;
  if(p.i<n-1){const b=S[leg.ids[p.i+1]];hx=b.x-a.x;hy=b.y-a.y;x=a.x+hx*(p.dwell?0:p.f);y=a.y+hy*(p.dwell?0:p.f)}
  else{const pr=S[leg.ids[p.i-1]];hx=a.x-pr.x;hy=a.y-pr.y;x=a.x;y=a.y}
  return{x,y,ang:Math.atan2(hy,hx)*180/Math.PI}}
const isStopIdx=(tr,leg,k)=>k===0||k===leg.ids.length-1||tr.stops.has(leg.ids[k]);
const evAbs=(tr,c,dir,tev)=>(c*tr.P-tr.off+(dir?tr.T+tr.L:0)+tev)*1000;
function trainState(tr,ms){
  const t=ms/1000+tr.off-tr.delay,c=Math.floor(t/tr.P),u=t-c*tr.P;
  let dir,ul,lay=false;
  if(u<tr.T){dir=0;ul=u}else if(u<tr.T+tr.L){dir=0;ul=tr.T;lay=true}else if(u<2*tr.T+tr.L){dir=1;ul=u-tr.T-tr.L}else{dir=1;ul=tr.T;lay=true}
  const leg=dir?tr.bwd:tr.fwd,p=legPos(leg,ul),ps=posOf(leg,p);
  let mode=lay?'term':(p.dwell?'dwell':'move'),speed=0;
  if(mode==='move'){const seg=leg.seg[p.i],d1=p.f*seg,d2=(1-p.f)*seg;speed=tr.v*clamp(0.25+0.75*Math.min(d1,d2)/14,0.25,1)}
  return{tr,dir,c,ul,p,leg,x:ps.x,y:ps.y,ang:ps.ang,mode,speed,lon:LONf(ps.x),lat:LATf(ps.y)}}
function nextStopIdx(st){const{tr,leg,p}=st;if(st.mode==='term')return -1;for(let k=p.i+1;k<leg.ids.length;k++)if(isStopIdx(tr,leg,k))return k;return -1}
function prevStopIdx(st){const{tr,leg,p}=st;for(let k=p.i;k>=0;k--)if(isStopIdx(tr,leg,k))return k;return 0}
function statusOf(st){const tr=st.tr,dm=Math.round(tr.delay/60);
  if(st.mode==='term')return{txt:'En cabecera',cls:'p-n'};
  if(st.mode==='dwell')return{txt:'Parado en '+S[st.leg.ids[st.p.i]].short,cls:'p-n'};
  if(dm>=15)return{txt:'Retraso '+dm+' min',cls:'p-crit'};
  if(dm>=3)return{txt:'Retraso '+dm+' min',cls:'p-warn'};
  return{txt:'En hora',cls:'p-ok'}}
function departures(stId,fromMs,limit){const res=[];
  for(const tr of TRAINS){if(!tr.stops.has(stId))continue;
    for(const dir of[0,1]){const leg=dir?tr.bwd:tr.fwd,i=leg.ids.indexOf(stId);if(i<0||i>=leg.ids.length-1)continue;
      const tev=(dir?tr.T+tr.L:0)+leg.dep[i],c=Math.ceil(((fromMs/1000-tr.delay)-tev+tr.off)/tr.P);
      const sched=(c*tr.P-tr.off+tev)*1000;res.push({tr,dir,c,sched,actual:sched+tr.delay*1000,dest:leg.ids[leg.ids.length-1]})}}
  return res.sort((a,b)=>a.actual-b.actual).slice(0,limit)}
function tripOptions(a,b,fromMs){const out=[];
  for(const tr of TRAINS){if(!tr.stops.has(a)||!tr.stops.has(b))continue;
    for(const dir of[0,1]){const leg=dir?tr.bwd:tr.fwd,ia=leg.ids.indexOf(a),ib=leg.ids.indexOf(b);if(ia<0||ib<0||ia>=ib)continue;
      const tev=(dir?tr.T+tr.L:0)+leg.dep[ia],c=Math.ceil(((fromMs/1000-tr.delay)-tev+tr.off)/tr.P);
      const dep=evAbs(tr,c,dir,leg.dep[ia]),arr=evAbs(tr,c,dir,leg.arr[ib]);
      out.push({tr,dir,c,a,b,dep,arr,depA:dep+tr.delay*1000,arrA:arr+tr.delay*1000})}}
  return out.filter(o=>o.depA-fromMs<8*3600e3).sort((x,y)=>x.depA-y.depA).slice(0,10)}
function tripLive(trip,ms){const tr=TR[trip.trainId],leg=trip.dir?tr.bwd:tr.fwd,ia=leg.ids.indexOf(trip.a),ib=leg.ids.indexOf(trip.b);
  const ul=ms/1000+tr.off-tr.delay-trip.c*tr.P-(trip.dir?tr.T+tr.L:0);
  const depA=leg.dep[ia],arrB=leg.arr[ib];
  const phase=ul<depA?'before':(ul>=arrB?'done':'run');
  const p=legPos(leg,clamp(ul,0,leg.T));
  const prog=clamp((p.dist-leg.cum[ia])/(leg.cum[ib]-leg.cum[ia]),0,1);
  let next=ib;for(let k=ia+1;k<=ib;k++){if(isStopIdx(tr,leg,k)&&leg.arr[k]>ul){next=k;break}}

  return{tr,leg,ia,ib,ul,depA,arrB,phase,p,prog,next,stops,elapsed:clamp(ul-depA,0,arrB-depA),remaining:Math.max(0,arrB-ul),until:Math.max(0,depA-ul),total:arrB-depA,
    etaMs:evAbs(tr,trip.c,trip.dir,arrB)+tr.delay*1000}}

function zoomAt(cx,cy,s){const nk=clamp(view.k*s,view.kmin,view.kmax);s=nk/view.k;view.x=cx-(cx-view.x)*s;view.y=cy-(cy-view.y)*s;view.k=nk;clampView();applyView()}
let flyId=0;
function flyTo(wx,wy,zrel,snap,force){const m=metrics(snap);const tk=clamp(force?view.k0*zrel:Math.max(view.k,view.k0*(zrel||2)),view.kmin,view.kmax);
  const tx=m.cx-wx*tk,ty=m.cy-wy*tk;
  if(RM){view.k=tk;view.x=tx;view.y=ty;clampView();applyView();return}
  const k0=view.k,x0=view.x,y0=view.y,t0=performance.now(),D=650,my=++flyId;
  (function step(n){if(my!==flyId)return;const u=clamp((n-t0)/D,0,1),e=1-Math.pow(1-u,3);
    const k=Math.exp(Math.log(k0)+(Math.log(tk)-Math.log(k0))*e);
    // interpolar el punto del mundo bajo el centro para evitar saltos
    const wx0=(m.cx-x0)/k0,wy0=(m.cy-y0)/k0,cwx=wx0+(wx-wx0)*e,cwy=wy0+(wy-wy0)*e;
    view.k=k;view.x=m.cx-cwx*k;view.y=m.cy-cwy*k;clampView();applyView();if(u<1)requestAnimationFrame(step)})(t0)}
const stopFly=()=>{flyId++};

/* punteros */
const ptrs=new Map();let downTarget=null,moved=0,userDrag=false;
svg.addEventListener('pointerdown',e=>{if(e.button>0)return;try{svg.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){downTarget=e.target;moved=0;userDrag=!!(e.target.closest&&e.target.closest('#userMark'))}else{downTarget=null;moved=99}stopFly()});
svg.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);
    if(userDrag&&X.nb.active){if(moved>4){const r=svg.getBoundingClientRect();const wx=(e.clientX-r.left-view.x)/view.k,wy=(e.clientY-r.top-view.y)/view.k;
      X.nb.user={lon:LONf(wx),lat:LATf(wy),real:false};X.nb.gpsMsg='';applyView();nearbyCalc(true)}}
    else if(moved>5){view.x+=dx;view.y+=dy;clampView();applyView()}}
  else if(ptrs.size===2){const other=ptrs.get([...ptrs.keys()].find(i=>i!==e.pointerId));const r=svg.getBoundingClientRect();
    const oc={x:(p.x+other.x)/2-r.left,y:(p.y+other.y)/2-r.top},nc={x:(e.clientX+other.x)/2-r.left,y:(e.clientY+other.y)/2-r.top};
    const od=Math.hypot(p.x-other.x,p.y-other.y)||1,nd=Math.hypot(e.clientX-other.x,e.clientY-other.y);
    view.x+=nc.x-oc.x;view.y+=nc.y-oc.y;zoomAt(nc.x,nc.y,nd/od)}
  p.x=e.clientX;p.y=e.clientY});
function endPtr(e,cancel){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){const tap=!cancel&&moved<8&&downTarget&&!userDrag;if(tap)mapTap(downTarget);downTarget=null;userDrag=false}}
svg.addEventListener('pointerup',e=>endPtr(e,false));svg.addEventListener('pointercancel',e=>endPtr(e,true));
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)))},{passive:false});
svg.addEventListener('dblclick',e=>{const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,1.9)});
function mapTap(t){closeResults();
  const rg=t.closest&&t.closest('[data-real]');if(rg){selectReal(rg.getAttribute('data-real'));return}
  const tg=t.closest&&t.closest('[data-train]');if(tg){selectTrain(tg.getAttribute('data-train'));return}
  const sg=t.closest&&t.closest('[data-st]');if(sg){selectStation(sg.getAttribute('data-st'),false);return}
  if(X.tab==='map'&&(X.view==='train'||X.view==='station')){deselect()}}

  if(f.station&&!tr.stops.has(f.station))return false;if(f.route&&!(tr.stops.has(f.route.a)&&tr.stops.has(f.route.b)))return false;return true}
const visibleTrains=()=>TRAINS.filter(passes);
const activeFilters=()=>X.filters.svcOff.size+X.filters.opOff.size+(X.filters.station?1:0)+(X.filters.route?1:0);
function renderChips(){const f=X.filters;let h=`<button class="chip clock" data-a="tab" data-t="settings" title="Reloj y velocidad de la demostración"><span id="clk">--:--</span><span id="clkx"> · ×${sim.speed}</span></button>`;

  $('#chips').innerHTML=h;const n=activeFilters(),b=$('#fbadge');b.hidden=!n;b.textContent=n;updateClock()}
function updateClock(){const c=$('#clk');if(c)c.textContent=REAL.on?'En directo '+fmtT(REAL.ts):'Demo '+fmtT(sim.t);const x=$('#clkx');if(x)x.textContent=REAL.on?'':(sim.paused?' · en pausa':' · ×'+sim.speed);

const qEl=$('#q'),resEl=$('#results');
function closeResults(){resEl.hidden=true}
function search(q){const nq=norm(q);if(!nq){closeResults();return}
  const found=[];STL.forEach(s=>{let best=-1;[s.short,s.name].forEach(n=>{const i=nq.indexOf(norm(n));if(i>=0&&(best<0||i<best))best=i});if(best>=0)found.push({s,i:best})});
  found.sort((a,b)=>a.i-b.i);
  const sts=STL.filter(s=>norm(s.name).includes(nq)||norm(s.short).includes(nq)).slice(0,5);
  const trs=TRAINS.filter(t=>t.num.includes(nq)||norm(SVC[t.svc].n).includes(nq)||norm(t.op).includes(nq)||norm(S[t.first].short).includes(nq)||norm(S[t.last].short).includes(nq)).slice(0,6);
  let h='';
  if(found.length>=2){const a=found[0].s,b=found[1].s,n=TRAINS.filter(t=>t.stops.has(a.id)&&t.stops.has(b.id)).length;
    h+=`<h4>Trayecto</h4><button class="res" data-a="routeFilter" data-x="${a.id}" data-y="${b.id}"><span class="ri">${I.route}</span><span><b>${esc(a.short)} ⇄ ${esc(b.short)}</b><small>${n?n+' trenes simulados cubren este trayecto':'Ningún tren simulado cubre este trayecto'}</small></span></button>`}
  if(sts.length)h+=`<h4>Estaciones</h4>`+sts.map(s=>`<button class="res" data-a="selStation" data-id="${s.id}"><span class="ri">${I.pin}</span><span><b>${esc(s.name)}</b><small>Estación${s.major?' principal':''}</small></span></button>`).join('');
  if(trs.length)h+=`<h4>Trenes</h4>`+trs.map(t=>`<button class="res" data-a="selTrain" data-id="${t.id}"><span class="ri" style="background:${t.c};color:#fff">${I.train}</span><span><b>${esc(trainName(t))}</b><small>${esc(S[t.first].short)} ⇄ ${esc(S[t.last].short)} · ${esc(t.op)}</small></span></button>`).join('');
  if(!h)h=`<div class="empty"><b>Sin resultados para «${esc(q)}»</b><br>Prueba con el nombre de una estación («Sevilla»), un número de tren («9012») o un trayecto («Madrid Barcelona»).</div>`;
  resEl.innerHTML=h;resEl.hidden=false}

function readForm(){const f=X.form;const a=$('#fA'),b=$('#fB'),n=$('#fNum'),t=$('#fTime');if(a)f.a=a.value;if(b)f.b=b.value;if(n)f.num=n.value.trim();if(t)f.time=t.value}

  if(f.num){const tr=TR[f.num];if(!tr)return err('No existe el tren «'+f.num+'» en la demostración. Los números simulados van del 9001 al '+(9000+TRAINS.length)+'.');
    if(!f.a&&!f.b){f.a=tr.first;f.b=tr.last;$('#fA').value=f.a;$('#fB').value=f.b}}
  if(!f.a||!f.b)return err('Elige origen y destino.');
  if(f.a===f.b)return err('El origen y el destino no pueden ser la misma estación.');
  let from=sim.t;if(f.time){const[h,m]=f.time.split(':').map(Number);const d=new Date(sim.t);d.setHours(h,m,0,0);if(d.getTime()>from)from=d.getTime()}
  f.results='loading';fillTripRes();$('#fErr').textContent='';
  setTimeout(()=>{if(X.view!=='tripSetup')return;let o=tripOptions(f.a,f.b,from);if(f.num)o=o.filter(x=>x.tr.num===f.num);
    if(f.num&&!o.length){f.results=null;return err('El tren '+f.num+' no hace el trayecto '+S[f.a].short+' → '+S[f.b].short+' en ese sentido. Prueba a intercambiar origen y destino.')}
    f.results=o;fillTripRes()},350)}

    set('tpPct',Math.round(lv.prog*100)+'%');$('#tpBar').style.width=(lv.prog*100)+'%';

    let state='';if(lv.phase==='before')state='Sale en '+fmtDur(lv.until);else if(lv.phase==='run')state=tr.delay>=180?'Retraso +'+Math.round(tr.delay/60)+' min':'En hora';else state='Has llegado';
    set('tpState',state);set('tpNext',lv.phase==='done'?'Destino':S[lv.leg.ids[lv.next]].short);set('tpEta',fmtT(lv.etaMs));

/* ----- trenes cercanos ----- */
const CARD=['N','NE','E','SE','S','SO','O','NO'];
const lvlTxt=['Sin aviso','Aviso amarillo','Aviso naranja','Aviso rojo'];
function nearbyCalc(force){const nb=X.nb;if(!nb.active){nb.level=0;nb.list=[];nb.cross=[];return}
  const u=nb.user,now=sim.t,future=now+120000,list=[];
  if(REAL.on){for(const t of REAL.list){const d=hav(u.lon,u.lat,t.lon,t.lat);const pd=REAL.prevD[t.id];REAL.prevD[t.id]=d;
      const p=Math.PI/180,dl=(t.lon-u.lon)*p,y=Math.sin(dl)*Math.cos(t.lat*p),x=Math.cos(u.lat*p)*Math.sin(t.lat*p)-Math.sin(u.lat*p)*Math.cos(t.lat*p)*Math.cos(dl);
      const brg=(Math.atan2(y,x)/p+360)%360;list.push({real:true,id:t.id,name:t.label,op:'Renfe',d,brg,card:CARD[Math.round(brg/45)%8],appr:pd!=null&&d<pd-.02,stopped:t.speed===0})}}
  else for(const tr of TRAINS){const st=CUR[tr.id];if(!st)continue;const d=hav(u.lon,u.lat,st.lon,st.lat);
    const s2=trainState(tr,future),d2=hav(u.lon,u.lat,s2.lon,s2.lat);
    const p=Math.PI/180,dl=(st.lon-u.lon)*p,y=Math.sin(dl)*Math.cos(st.lat*p),x=Math.cos(u.lat*p)*Math.sin(st.lat*p)-Math.sin(u.lat*p)*Math.cos(st.lat*p)*Math.cos(dl);
    const brg=(Math.atan2(y,x)/p+360)%360;
    list.push({tr,st,d,brg,card:CARD[Math.round(brg/45)%8],appr:st.mode==='move'?d2<d-.3:false,stopped:st.mode!=='move'})}
  list.sort((a,b)=>a.d-b.d);nb.list=list;
  const S_=X.settings,near=list[0];nb.level=!near?0:near.d<=S_.r3?3:near.d<=S_.r2?2:near.d<=S_.r1?1:0;
  /* vía más cercana y cruces */
  const ux=WXf(u.lon),uy=WYf(u.lat);let best=null;
  for(const e of EDGES){const A=S[e.a],B=S[e.b],vx=B.x-A.x,vy=B.y-A.y,t=clamp(((ux-A.x)*vx+(uy-A.y)*vy)/(vx*vx+vy*vy),0,1),px=A.x+t*vx,py=A.y+t*vy,km=Math.hypot(ux-px,uy-py)/KMU;if(!best||km<best.km)best={e,t,px,py,km}}
  nb.nearTrack=best;const cross=[];
  if(best&&best.km<=2.5&&!REAL.on){for(const tr of TRAINS){const st=CUR[tr.id];if(!st||st.mode==='term')continue;const leg=st.leg,p=st.p;let j=-1;
      for(let q=p.i;q<leg.ids.length-1;q++){const a=leg.ids[q],b=leg.ids[q+1];if((a===best.e.a&&b===best.e.b)||(a===best.e.b&&b===best.e.a)){j=q;break}}
      if(j<0)continue;const tt=leg.ids[j]===best.e.a?best.t:1-best.t;let dist;
      if(j===p.i){if(tt<p.f)continue;dist=(tt-p.f)*leg.seg[j]}else{dist=(1-p.f)*leg.seg[p.i];for(let q=p.i+1;q<j;q++)dist+=leg.seg[q];dist+=tt*leg.seg[j]}
      const secs=dist/tr.v*3600;if(secs<=90*60)cross.push({tr,dist,secs})}
    cross.sort((a,b)=>a.secs-b.secs)}
  nb.cross=cross.slice(0,5);
  if(nb.level>nb.lastLevel&&X.settings.nProx&&nb.level>0&&performance.now()-(nb.lastNotif||-1e9)>15000){nb.lastNotif=performance.now();notify(lvlTxt[nb.level]+' de proximidad',`${nm(near)} a ${fmtKm(near.d)} km (${near.card}).`,nb.level)}
  nb.lastLevel=nb.level}
function updateRings(){const nb=X.nb,on=nb.active;$('#userG').style.display=on?'':'none';if(!on)return;const S_=X.settings;
  [['rg1',S_.r1,1],['rg2',S_.r2,2],['rg3',S_.r3,3]].forEach(([id,r,l])=>{const c=$('#'+id);const u=nb.user;c.setAttribute('cx',WXf(u.lon).toFixed(1));c.setAttribute('cy',WYf(u.lat).toFixed(1));c.setAttribute('r',(r*KMU).toFixed(1));c.classList.toggle('on',nb.level===l)})}
const slider=(k,label,min,max,col)=>`<div class="slider"><label for="sl-${k}"><i style="background:${col}"></i>${label}</label><input id="sl-${k}" type="range" min="${min}" max="${max}" step="1" value="${X.settings[k]}" data-a="slider" data-k="${k}"><output id="out-${k}">${X.settings[k]} km</output></div>`;
VIEWS.nearby={render(){const nb=X.nb;
  return{head:headHTML({title:'Trenes cercanos',sub:`Alrededor de tu posición · ${DEMOTAG}`})+`<div class="lvlbar" id="nbBanner">Calculando…</div>`,
  body:`<div class="card"><div style="display:flex;gap:10px;align-items:center"><span class="arrow" style="background:var(--accent-soft);color:var(--accent)">${I.pin}</span><div style="flex:1;min-width:0"><b id="nbPosT">Posición de prueba</b><div style="font-size:12.5px;color:var(--text2)" id="nbPosS"></div></div></div>
    <div class="btns"><button class="btn sm" data-a="useGps">Usar mi ubicación</button><button class="btn sm" data-a="nearTrack">Colocarme junto a una vía</button></div>
    <label class="field" style="margin-bottom:0"><span>Mover mi posición de prueba a una estación</span><select id="nbSt" data-a="nbStation">${stOptions('')}</select></label>
    <p class="note" style="margin-bottom:0">También puedes arrastrar el punto azul sobre el mapa.</p></div>
  <div class="set"><div class="sm"><b>Vigilancia de proximidad</b><small>Dibuja los anillos de aviso y lanza alertas en todas las pestañas.</small></div><button class="sw" role="switch" aria-checked="${nb.active}" data-a="nbToggle" aria-label="Vigilancia de proximidad"></button></div>
  <h3 class="sec">Trenes a tu alrededor</h3><div id="nbList"></div>

  <h3 class="sec">Distancias de aviso</h3>${slider('r1','Amarillo',6,80,'var(--lvl1)')}${slider('r2','Naranja',3,60,'var(--lvl2)')}${slider('r3','Rojo',1,30,'var(--lvl3)')}
  <p class="note">Los avisos visuales se muestran dentro de la app. Las notificaciones nativas y el seguimiento en segundo plano no están disponibles en este entorno.</p>`}},
  live(){const nb=X.nb,S_=X.settings;const set=(id,v)=>{const e=$('#'+id);if(e&&e.innerHTML!==v)e.innerHTML=v};
    set('nbPosT',nb.user.real?'Tu ubicación (GPS)':'Posición de prueba');
    set('nbPosS',(nb.gpsMsg?esc(nb.gpsMsg)+'<br>':'')+`${nb.user.lat.toFixed(3)}°, ${nb.user.lon.toFixed(3)}°`);
    const b=$('#nbBanner');if(b){const near=nb.list[0];b.className='lvlbar'+(nb.level?' l'+nb.level:'');
      b.innerHTML=!nb.active?'Vigilancia desactivada':near?(nb.level?`${lvlTxt[nb.level]}: ${esc(nm(near))} a ${fmtKm(near.d)} km`:`Sin avisos · tren más cercano a ${fmtKm(near.d)} km`):'Sin trenes'}
    const L=$('#nbList');if(L){if(!nb.active)L.innerHTML=emptyBox('Vigilancia desactivada','Actívala para ver los trenes que se acercan.');
      else{const shown=nb.list.filter(o=>o.d<=S_.r1*1.6).slice(0,6);const arr=shown.length?shown:nb.list.slice(0,1);
        L.innerHTML=(shown.length?'':`<div class="empty" style="padding:6px 0 10px;text-align:left">Ningún tren dentro de ${S_.r1} km. El más cercano es:</div>`)+arr.map(o=>{const lv=o.d<=S_.r3?3:o.d<=S_.r2?2:o.d<=S_.r1?1:0;
           return`<button class="row" data-a="${o.real?'selReal':'selTrain'}" data-id="${o.real?esc(o.id):o.tr.id}"><span class="arrow" style="${lv?'background:var(--lvl'+lv+');color:'+(lv===3?'#fff':'#111'):''}"><span style="display:grid;transform:rotate(${o.brg.toFixed(0)}deg)">${I.arrow}</span></span><span class="rm"><b>${esc(nm(o))} · ${fmtKm(o.d)} km ${o.card}</b><small>${o.real?'Renfe':esc(o.tr.op)+' → '+esc(S[o.st.leg.ids[o.st.leg.ids.length-1]].short)} · ${o.stopped?'parado':o.appr?'se acerca':'se aleja'}</small></span>${lv?pill(['','Amarillo','Naranja','Rojo'][lv],lv===3?'p-crit':'p-warn'):''}</button>`}).join('')}}
    const C=$('#nbCross');if(C){if(!nb.active)C.innerHTML=emptyBox('Vigilancia desactivada','Actívala para calcular cruces.');
      else if(REAL.on)C.innerHTML=`<div class="empty" style="text-align:left;padding:6px 0">El cálculo de cruces solo está disponible con datos de demostración.</div>`;
      else if(!nb.nearTrack||nb.nearTrack.km>2.5)C.innerHTML=emptyBox('No hay vías a menos de 2,5 km',`La vía más cercana está a ${nb.nearTrack?fmtKm(nb.nearTrack.km):'—'} km.`,`<button class="btn sm" data-a="nearTrack">Colocarme junto a una vía</button>`);
      else if(!nb.cross.length)C.innerHTML=`<div class="empty" style="text-align:left;padding:6px 0">Hay una vía a ${fmtKm(nb.nearTrack.km)} km, pero ningún tren simulado la cruzará en los próximos 90 min.</div>`;
      else C.innerHTML=`<div class="note" style="margin-top:0">Vía a ${fmtKm(nb.nearTrack.km)} km de ti. Trenes que pasarán por el punto más próximo:</div>`+nb.cross.map(c=>`<button class="row" data-a="selTrain" data-id="${c.tr.id}"><span class="dotc" style="background:${c.tr.c}"></span><span class="rm"><b>${esc(trainName(c.tr))}</b><small>Pasa en ${fmtDur(c.secs)} (hora demo) · a ${fmtKm(c.dist)} km</small></span></button>`).join('')}}};

  <div class="btns"><button class="btn sm" data-a="testNotif">${I.bell} Enviar aviso de prueba</button></div>

  <h3 class="sec">Ubicación</h3>${swRow('gps','Permitir intentar GPS','Se usa solo al pulsar «Usar mi ubicación» en Trenes cercanos. Si el entorno no lo permite, se usa una posición de prueba.')}

/* ---------- navegación ---------- */
const TABS=[['map','Mapa',I.map],['trip','Viaje',I.train],['nearby','Cerca',I.near],['saved','Guardados',I.star],['settings','Ajustes',I.gear]];
$('#tabbar').innerHTML=TABS.map(([t,l,i])=>`<button class="tab" data-a="tab" data-t="${t}" aria-label="${l}">${i}<span>${l}</span></button>`).join('');
function setTabUI(){$$('.tab').forEach(b=>{const on=b.dataset.t===X.tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function setTab(t){X.tab=t;setTabUI();let v;
  if(t==='map')v=X.selReal?'real':X.selTrain?'train':X.selStation?'station':'list';
  else if(t==='trip')v=X.trip?'trip':'tripSetup';else v=t;
  if(t==='nearby'&&!X.nb.active){X.nb.active=true;nearbyCalc();updateRings()}
  setView(v);if(t==='nearby')flyTo(WXf(X.nb.user.lon),WYf(X.nb.user.lat),2.2,'half')}

/* ---------- modales y avisos ---------- */
const modal=$('#modal');let modalLiveFn=null;
function openModal(html,live){modal.innerHTML=`<div class="mpanel" role="dialog" aria-modal="true">${html}</div>`;modal.hidden=false;modalLiveFn=live||null;const f=$('button,input,select,textarea',modal);if(f)f.focus();if(live)live()}
function closeModal(){modal.hidden=true;modal.innerHTML='';modalLiveFn=null}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)closeModal();else closeResults()}});
function toast(title,body,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.innerHTML=`<div><b>${esc(title)}</b>${body?`<small>${esc(body)}</small>`:''}</div>`;$('#toasts').append(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320)},3200);while($('#toasts').children.length>2)$('#toasts').firstChild.remove()}
function notify(title,body,lvl){toast('🔔 '+title,body+' (notificación simulada dentro de la app)',lvl===3);pulseIsland()}
function filterModal(){const f=X.filters;
  const ops=OPS.map(o=>`<button class="chip ${f.opOff.has(o)?'off':'on'}" style="--c:var(--accent)" data-a="chipOp" data-o="${o}" aria-pressed="${!f.opOff.has(o)}"><i></i>${o}</button>`).join('');
  const svs=Object.keys(SVC).map(k=>`<button class="chip ${f.svcOff.has(k)?'off':'on'}" style="--c:${SVC[k].c}" data-a="chipSvc" data-s="${k}" aria-pressed="${!f.svcOff.has(k)}"><i></i>${SVC[k].n}</button>`).join('');
  openModal(`<div class="mhead"><h2>Filtros</h2><button class="ib" data-a="modalClose" aria-label="Cerrar">${I.close}</button></div>
  <h3 class="sec" style="margin-top:8px">Operador</h3><div class="chipset">${ops}</div>
  <h3 class="sec">Tipo de servicio</h3><div class="chipset">${svs}</div>
  <label class="field"><span>Estación</span><select id="fltSt" data-a="fltStation">${'<option value="">Todas las estaciones</option>'+[...STL].sort((a,b)=>a.short.localeCompare(b.short,'es')).map(s=>`<option value="${s.id}"${f.station===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
  ${f.route?`<div class="chipset"><button class="chip act" data-a="clearRoute">Trayecto ${esc(S[f.route.a].short)} ⇄ ${esc(S[f.route.b].short)} ✕</button></div>`:''}
  <p class="note"><b>${visibleTrains().length}</b> de ${TRAINS.length} trenes visibles.</p>
  <div class="btns"><button class="btn" data-a="clearFilters">Restablecer</button><button class="btn pri" data-a="modalClose">Listo</button></div>`)}
function parseTicket(text){const q=norm(text);const found=[];
  STL.forEach(s=>{let best=-1;[s.short,s.name].forEach(n=>{const i=q.indexOf(norm(n));if(i>=0&&(best<0||i<best))best=i});if(best>=0)found.push({s,i:best})});found.sort((a,b)=>a.i-b.i);
  const num=(text.match(/\b(9\d{3})\b/)||[])[1];const tm=text.match(/\b([01]?\d|2[0-3])[:h.]([0-5]\d)\b/);
  return{a:found[0]&&found[0].s.id,b:found[1]&&found[1].s.id,num:num&&TR[num]?num:'',time:tm?pad(+tm[1])+':'+tm[2]:''}}
function importModal(){openModal(`<div class="mhead"><h2>Importar billete</h2><button class="ib" data-a="modalClose" aria-label="Cerrar">${I.close}</button></div>
  <p class="note" style="margin-top:0">Pega el texto de tu billete o elige un archivo de texto (.txt, .ics, .csv). Se analiza en tu dispositivo y no se envía a ningún sitio. No puedo leer PDF ni imágenes en este entorno.</p>
  <label class="field"><span>Texto del billete</span><textarea id="tkText" placeholder="Ej.: Madrid Puerta de Atocha 08:30 → Barcelona Sants 11:05 · Tren 9012"></textarea></label>
  <label class="field"><span>O elige un archivo</span><input id="tkFile" type="file" accept=".txt,.ics,.csv,.json,.html,text/*"></label>
  <div class="err" id="tkErr" role="alert"></div><div id="tkOut"></div>
  <div class="btns"><button class="btn pri" data-a="tkParse">Analizar</button></div>`)}
function liveModal(){const t=X.trip;
  openModal(`<div class="mhead"><h2>Live Activity</h2><button class="ib" data-a="modalClose" aria-label="Cerrar">${I.close}</button></div>
  ${t?`<div class="la"><div class="clock" id="laClock">9:41</div><div class="dt">Pantalla de bloqueo · simulación</div>
   <div class="lacard"><div class="top"><span class="sb" style="--c:${TR[t.trainId].c}">${esc(SVC[TR[t.trainId].svc].n)}</span><span>${esc(TR[t.trainId].num)}</span><em>SIMULACIÓN</em></div>
   <div class="rt">${esc(S[t.a].short)} → ${esc(S[t.b].short)}</div><div class="track"><i id="laBar"></i><b id="laDot">${I.train.replace('class="ico"','style="width:12px;height:12px"')}</b></div>
   <div class="meta"><span id="laNext">—</span><span id="laEta">—</span></div></div></div>
   <p class="note">Esto es una simulación visual dentro de la app. No crea una Live Activity real en tu iPhone.</p>`
  :emptyBox('No hay un viaje activo','Inicia un viaje en la pestaña Viaje para ver su Live Activity simulada.',`<button class="btn pri" data-a="modalClose">Entendido</button>`)}`,liveModalTick)}
function liveModalTick(){if(!X.trip)return;const lv=tripLive(X.trip,sim.t);const set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v};
  set('laClock',fmtT(sim.t));const b=$('#laBar'),d=$('#laDot');if(b){b.style.width=(lv.prog*100)+'%';d.style.left=(lv.prog*100)+'%'}
  set('laNext',lv.phase==='done'?'Has llegado':lv.phase==='before'?'Sale en '+fmtDur(lv.until):'Próxima: '+S[lv.leg.ids[lv.next]].short);set('laEta','Llegada '+fmtT(lv.etaMs))}

/* ---------- Dynamic Island (simulación) ---------- */
const isl=$('#island');let islKey='';
function pulseIsland(){if(!X.settings.island||RM)return;isl.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.08)'},{transform:'translateX(-50%) scale(1)'}],{duration:500})}
function updateIsland(){let data=null;const nb=X.nb;
  if(X.settings.island){
    if(nb.active&&nb.level>0&&nb.list[0]){const o=nb.list[0];data={dot:['','var(--lvl1)','var(--lvl2)','var(--lvl3)'][nb.level],short:`${lvlTxt[nb.level]} · ${fmtKm(o.d)} km`,pct:'',title:lvlTxt[nb.level]+' de proximidad',l1:`${nm(o)} a ${fmtKm(o.d)} km (${o.card})`,l2:o.appr?'Se acerca':o.stopped?'Parado':'Se aleja',prog:null}}
    else if(X.trip){const lv=tripLive(X.trip,sim.t),tr=lv.tr;data={dot:tr.c,short:`${S[X.trip.a].short} → ${S[X.trip.b].short}`,pct:Math.round(lv.prog*100)+'%',title:`${trainName(tr)}`,l1:`${S[X.trip.a].short} → ${S[X.trip.b].short}`,l2:lv.phase==='done'?'Has llegado':lv.phase==='before'?'Sale en '+fmtDur(lv.until):'Próxima: '+S[lv.leg.ids[lv.next]].short+' · llegada '+fmtT(lv.etaMs),prog:lv.prog}}}
  app.classList.toggle('has-island',!!data);if(!data){isl.hidden=true;islKey='';X.islandOpen=false;return}
  isl.hidden=false;const key=(X.islandOpen?'o':'c')+data.title;
  isl.classList.toggle('open',X.islandOpen);
  if(key!==islKey){islKey=key;isl.innerHTML=''}
  if(X.islandOpen){isl.innerHTML=`<div class="ex"><div class="h"><i style="background:${data.dot}"></i>${esc(data.title)}</div><div>${esc(data.l1)}</div>${data.prog!=null?`<div class="bar"><i style="width:${data.prog*100}%;transition:none"></i></div>`:''}<div class="s"><span>${esc(data.l2)}</span>${data.pct?`<span>${data.pct}</span>`:''}</div><div class="sim">Simulación de Dynamic Island</div></div>`}
  else{isl.innerHTML=`<div class="ic"><i style="background:${data.dot}"></i><span class="t">${esc(data.short)}</span>${data.pct?`<em>${data.pct}</em>`:''}</div>`}}
isl.addEventListener('click',()=>{X.islandOpen=!X.islandOpen;islKey='';updateIsland()});

/* ---------- banner de proximidad ---------- */
function updateBanner(){const b=$('#banner'),nb=X.nb;const show=nb.active&&nb.level>0&&nb.list[0]&&X.view!=='nearby';b.hidden=!show;if(!show)return;
  const o=nb.list[0];b.className='banner l'+nb.level;b.innerHTML=`<span>⚠</span><span style="flex:1">${lvlTxt[nb.level]}: ${esc(nm(o))} a ${fmtKm(o.d)} km (${o.card})</span>`}

/* ---------- seguimiento de viaje ---------- */
function startTrip(o){X.trip={trainId:o.tr.id,dir:o.dir,c:o.c,a:o.a,b:o.b,logged:false,notified:{}};X.selTrain=null;X.selStation=null;markSel();X.tab='trip';setTabUI();setView('trip');drawHL();
  const lv=tripLive(X.trip,sim.t);const st=CUR[o.tr.id];if(st)flyTo(st.x,st.y,2,'half');
  toast('Seguimiento iniciado',`${nm(o)} · ${S[o.a].short} → ${S[o.b].short}`);
  if(X.settings.nDelay&&o.tr.delay>=180)setTimeout(()=>notify('Tu tren sale con retraso',`${nm(o)} lleva +${Math.round(o.tr.delay/60)} min.`,1),600)}
function logTrip(state){const t=X.trip;if(!t||t.logged)return;t.logged=true;const tr=TR[t.trainId];X.hist.unshift({a:t.a,b:t.b,name:trainName(tr),when:fmtT(sim.t),state});persist()}
function endTrip(){const t=X.trip;if(!t)return;const lv=tripLive(t,sim.t);logTrip(lv.phase==='done'?'Completado':'Finalizado antes de llegar');X.trip=null;drawHL();toast('Viaje guardado en el historial');X.form.results=null;if(X.tab==='trip')setView('tripSetup')}
function tripWatch(){const t=X.trip;if(!t)return;const lv=tripLive(t,sim.t);
  if(lv.phase==='done'&&!t.notified.arr){t.notified.arr=1;logTrip('Completado');if(X.settings.nArr)notify('Has llegado a '+S[t.b].short,trainName(lv.tr)+'.',1);else toast('Has llegado a '+S[t.b].short)}
  if(lv.phase==='run'&&lv.next!==lv.ib&&!t.notified['n'+lv.next]&&lv.leg.arr[lv.next]-lv.ul<150){t.notified['n'+lv.next]=1;if(X.settings.nStop)notify('Próxima parada: '+S[lv.leg.ids[lv.next]].short,'Llegas hacia las '+fmtT(evAbs(lv.tr,t.c,t.dir,lv.leg.arr[lv.next])+lv.tr.delay*1000)+'.',1)}}

setInterval(()=>liveTick(),500);

 repeatHist(e,d){const h=X.hist[+d.i];X.form={a:h.a,b:h.b,num:'',time:fmtT(sim.t),results:null,err:''};X.tab='trip';setTabUI();setView(X.trip?'trip':'tripSetup');if(!X.trip)setTimeout(()=>runSearch(),50)},
 clearHist(){X.hist=[];persist();renderView(true);toast('Historial borrado')},
 tripFrom(e,d){X.form={a:d.id,b:'',num:'',time:fmtT(sim.t),results:null,err:''};X.selStation=null;markSel();drawHL();X.tab='trip';setTabUI();setView(X.trip?'trip':'tripSetup')},
 swapAB(){readForm();const f=X.form;[f.a,f.b]=[f.b,f.a];f.results=null;renderView(true)},
 searchTrips(){runSearch()},
 startOpt(e,d){const o=X.form.results[+d.i];if(!o)return;if(X.trip){toast('Ya tienes un viaje en curso','Finalízalo antes de empezar otro.',true);return}startTrip(o)},
 boardTrain(){const st=CUR[X.selTrain];if(!st)return;if(X.trip){toast('Ya tienes un viaje en curso','Finalízalo antes de empezar otro.',true);return}
  const b=$('#tvDest').value;if(!b){toast('Elige un destino',null,true);return}
  let dir=st.dir,c=st.c,a;if(st.mode==='term'){if(st.dir===0){dir=1}else{dir=0;c=st.c+1}a=(dir?st.tr.bwd:st.tr.fwd).ids[0]}else a=st.leg.ids[prevStopIdx(st)];
  startTrip({tr:st.tr,dir,c,a,b})},
 centerTrain(){const st=CUR[X.selTrain];if(st)flyTo(st.x,st.y,3,'half')},
 tripCenter(){const st=CUR[X.trip.trainId];if(st){setSnap('peek');flyTo(st.x,st.y,2.4,'peek')}},
 endTrip(){endTrip()},
 liveOpen(){liveModal()},
 importOpen(){importModal()},
 tkParse(){const err=$('#tkErr'),out=$('#tkOut');err.textContent='';out.innerHTML='';const txt=$('#tkText').value.trim();const file=$('#tkFile').files[0];
  const go=text=>{const r=parseTicket(text);if(!r.a||!r.b){err.textContent='No encontré dos estaciones en el texto. Comprueba que aparezcan origen y destino con su nombre (por ejemplo «Madrid» y «Sevilla»).';return}
    out.innerHTML=`<div class="card"><b>${esc(S[r.a].short)} → ${esc(S[r.b].short)}</b><div style="color:var(--text2);font-size:13.5px;margin-top:3px">${r.num?'Tren '+r.num+' · ':''}${r.time?'Hora '+r.time:'Sin hora detectada'}</div></div><div class="btns"><button class="btn pri" data-a="tkUse" data-a2="${r.a}" data-b2="${r.b}" data-n="${r.num}" data-t="${r.time}">Usar estos datos</button></div><p class="note">Lectura aproximada: revisa los datos antes de buscar.</p>`};
  if(file){if(!/^text\/|\.(txt|ics|csv|json|html)$/i.test(file.type||file.name)){err.textContent='No puedo leer ese tipo de archivo aquí (PDF o imagen). Copia el texto del billete y pégalo en el cuadro.';return}
    const fr=new FileReader();fr.onload=()=>go(String(fr.result));fr.onerror=()=>{err.textContent='No se pudo leer el archivo. Prueba a pegar su texto.'};fr.readAsText(file)}
  else if(txt)go(txt);else err.textContent='Pega el texto del billete o elige un archivo.'},
 tkUse(e,d){X.form={a:d.a2,b:d.b2,num:d.n||'',time:d.t||fmtT(sim.t),results:null,err:''};closeModal();X.tab='trip';setTabUI();setView(X.trip?'trip':'tripSetup');if(!X.trip)setTimeout(()=>runSearch(),50)},
 useGps(){const nb=X.nb;if(!X.settings.gps){nb.gpsMsg='La ubicación está desactivada en Ajustes.';return}
  nb.gpsMsg='Buscando tu ubicación…';let done=false;const fail=m=>{if(done)return;done=true;nb.gpsMsg=m;toast('Ubicación no disponible','Usa la posición de prueba: arrastra el punto azul o elige una estación.',true)};
  try{if(!navigator.geolocation)return fail('Este entorno no permite acceder al GPS. Se mantiene la posición de prueba.');
    navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;nb.user={lon:p.coords.longitude,lat:p.coords.latitude,real:true};nb.gpsMsg='Ubicación obtenida. El seguimiento en segundo plano no está disponible.';nb.active=true;applyView();nearbyCalc();flyTo(WXf(nb.user.lon),WYf(nb.user.lat),2,'half')},
      err=>fail(err&&err.code===1?'Permiso de ubicación denegado. Se mantiene la posición de prueba.':'No se pudo obtener la ubicación. Se mantiene la posición de prueba.'),{timeout:6000,maximumAge:60000});
    setTimeout(()=>fail('Sin respuesta de la ubicación. Se mantiene la posición de prueba.'),7000)}catch(e){fail('Este entorno no permite acceder al GPS. Se mantiene la posición de prueba.')}},
 nearTrack(){const nb=X.nb;nb.active=true;nearbyCalc();const b=nb.nearTrack;if(!b)return;const dx=b.px-WXf(nb.user.lon),dy=b.py-WYf(nb.user.lat),n=Math.hypot(dx,dy)||1;
  const off=0.35*KMU;nb.user={lon:LONf(b.px-dx/n*off),lat:LATf(b.py-dy/n*off),real:false};if(n<1e-3)nb.user={lon:LONf(b.px+off),lat:LATf(b.py),real:false};nb.gpsMsg='';applyView();nearbyCalc();updateRings();flyTo(b.px,b.py,3,'half');liveTick()},
 nbStation(e){const id=e.target.value;if(!id)return;const s=S[id];X.nb.user={lon:s.lon+0.03,lat:s.lat+0.025,real:false};X.nb.gpsMsg='';X.nb.active=true;applyView();nearbyCalc();updateRings();flyTo(s.x,s.y,3,'half');liveTick()},
 nbToggle(e){X.nb.active=!X.nb.active;e.currentTarget.setAttribute('aria-checked',X.nb.active);if(X.nb.active){nearbyCalc();updateRings();applyView()}else{X.nb.lastLevel=0;updateRings()}liveTick()},
 slider(e,d){const k=d.k,s=X.settings;let v=+e.target.value;s[k]=v;
  if(k==='r1'){if(s.r2>=v)s.r2=Math.max(2,v-1);if(s.r3>=s.r2)s.r3=Math.max(1,s.r2-1)}
  if(k==='r2'){if(s.r1<=v)s.r1=Math.min(80,v+1);if(s.r3>=v)s.r3=Math.max(1,v-1)}
  if(k==='r3'){if(s.r2<=v)s.r2=v+1;if(s.r1<=s.r2)s.r1=Math.min(80,s.r2+1)}
  ['r1','r2','r3'].forEach(q=>{const i=$('#sl-'+q),o=$('#out-'+q);if(i)i.value=s[q];if(o)o.textContent=s[q]+' km'});persist();nearbyCalc();updateRings()},
 setBool(e,d){const k=d.k;if(k==='pausa'){A.pause();return}X.settings[k]=!X.settings[k];persist();if(k==='lines')svg.classList.toggle('no-cv',!X.settings.lines);if(k==='labels')lbl(X.settings.labels);if(k==='island')updateIsland();renderView(true)},
 setVal(e,d){const k=d.k;if(k==='theme'){X.settings.theme=d.v;applyTheme()}if(k==='speed'){X.settings.speed=+d.v;sim.speed=+d.v;renderChips()}if(k==='source'){X.settings.source=d.v;persist();pollReal();return}persist();renderView(true)},
 testNotif(){notify('Aviso de prueba','Así se verían tus avisos de proximidad y de viaje.',1)},
 wipe(){try{localStorage.removeItem(KEY)}catch(e){}X.favs={routes:[],trains:[],stations:[]};X.hist=[];X.settings={...DEF};sim.speed=DEF.speed;sim.paused=false;applyTheme();svg.classList.remove('no-cv','no-lbl');renderChips();renderView(true);toast('Datos locales borrados')},
};
function rerenderFilter(){if(!modal.hidden&&$('#fltSt'))filterModal();}
function updateListSub(){if(X.view==='list'&&!REAL.on){const p=$('.ht p',shead);if(p)p.innerHTML=`${visibleTrains().length} de ${TRAINS.length} · ${DEMOTAG}`}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.tagName==='SELECT'||t.tagName==='INPUT')return;
  const fn=A[t.dataset.a];if(fn){const d=t.dataset;fn({currentTarget:t,target:e.target},d)}});
document.addEventListener('change',e=>{const t=e.target.closest('select[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](e,t.dataset);if(e.target.id==='fA'||e.target.id==='fB'||e.target.id==='fTime')readForm()});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('input[type=range][data-a]'))A.slider(e,t.dataset);if(t.id==='fNum'){const v=t.value.trim();X.form.num=v;const tr=TR[v];$('#fErr').textContent=v.length>=4&&!tr?'No existe el tren «'+v+'».':'';if(tr&&!$('#fA').value&&!$('#fB').value){$('#fA').value=tr.first;$('#fB').value=tr.last;readForm()}}});
document.addEventListener('click',e=>{if(!e.target.closest('.topbar'))closeResults()});

/* ---------- arranque ---------- */
function init(){
  applyTheme();buildMap();svg.classList.toggle('no-cv',!X.settings.lines);lbl(X.settings.labels);
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{});
  tickSim();for(const tr of TRAINS)CUR[tr.id]=trainState(tr,sim.t);
  renderChips();setTabUI();fitView('peek');setView('list');updateRings();pollReal();setInterval(pollReal,15000);
  addEventListener('resize',()=>{fitView(X.snap);updateRings()});
  requestAnimationFrame(frame);
  setTimeout(()=>$('#loading').classList.add('done'),650);setTimeout(()=>$('#loading').remove(),1300);
}
try{init()}catch(e){console.error('init',e);$('#loading').innerHTML='<div style="padding:24px;max-width:320px"><b>No se pudo iniciar la aplicación</b><br><br>Ha ocurrido un error al preparar el mapa. Recarga la página para intentarlo de nuevo.<br><br><button class="btn pri" onclick="location.reload()">Recargar</button></div>'}
})();
</script>
